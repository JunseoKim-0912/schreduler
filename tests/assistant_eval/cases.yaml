      - say: "ECE360 Lab 매주 화요일 9-12시 Lecture period 동안 9/22일부터 2주마다 중요도 4"
        expect:
          db_unchanged: true
          proposal:
            count: 1
            items:
              - kind: create_event
                title_contains: ECE360 Lab
                rrule_contains: [INTERVAL=2, BYDAY=TU]
                start: "09:00"
                end: "12:00"
                importance: 4
                recurrence_start: "2026-09-22"
                preview_dates: ["2026-10-06", "2026-10-20", "2026-11-03"]
                date_range: Lecture Period
                warnings_exclude: [past_date]

  - id: biweekly_without_start_thursday_range
