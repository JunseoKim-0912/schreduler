# 일정 어시스턴트 평가 세트 (docs/assistant_design.md §8, §11.7).
# 실행: python -m app.scripts.eval_assistant --model gpt-5.6-luna --effort low   (실제 API 비용이 든다. pytest에는 넣지 않는다)
#
# 케이스마다 임시 SQLite DB에 seed(기본값 + 케이스별 덮어쓰기)를 만들고, now(America/Toronto 벽시계)를 고정한다.
# 턴 i의 시각은 now + i분. 모든 턴은 같은 세션에서 이어진다.
#
# 턴 기대 조건 (모두 만족해야 통과):
#   proposal: null                    이번 턴에 새 제안이 없어야 함
#   proposal: {count, items: [...]}   items의 각 조건을 만족하는 카드가 하나씩 있어야 함
#   db_unchanged: true                이벤트·회차·기간·장소 테이블이 턴 전후로 같음 (확인 전 DB 변화 없음)
#   executed_min / executed_count     채팅 승인으로 실행된 변경 수
#   tools_called / tools_not_called   이번 턴에 부른(부르지 않은) 도구
#   previous_status                   직전 턴 제안의 상태 (예: superseded)
#   same_as_previous: [필드...]       첫 카드의 값이 직전 턴 첫 카드와 같음
#   reply_language: ko|en             답변 언어 (한글 포함 여부로 판별)
#   reply_contains: [문자열...]        답변에 들어 있어야 하는 말 (대소문자 무시)
#   any_of: [{조건...}, {조건...}]     나열한 기대 중 하나만 만족하면 통과
#   previous_items: [카드 조건...]     직전 턴의 제안에 이 조건을 만족하는 카드가 있음
#   proposal.kinds_exclude: [kind...]  제안에 있으면 안 되는 카드 종류
#   db_events: [{title_contains, location, count}]   턴 뒤 DB에 있어야 하는 일정
# seed.events: days가 있으면 매주 반복(range 필요), 없으면 단발 — type: deadline이면 end가 마감 시각
# 카드 조건: kind, title_contains, event_type, date, start, end, start_in, duration_minutes, importance, importance_in,
#   recurring, rrule_contains, rrule_not_contains, recurrence_start, preview_dates, date_range, date_range_start,
#   date_range_end, location, location_new, warnings_include, warnings_exclude, scope, target_titles, target_count,
#   target_dates, changes (카드 changes의 부분 일치), range_start, range_end, date_range_new, inferred_includes
#
# 범주 태그: 격주, 오전오후, 마감, 확인안전, 수정, 삭제, 기간, 장소, 다국어, 기타
# 필수 범주(100% 통과해야 함): 격주, 오전오후, 마감, 확인안전

seed:
  user: {name: 평가 사용자, language: ko}
  ranges:
    - {name: 2026-2학기, start: "2026-09-01", end: "2026-12-20"}
    - {name: Lecture Period, start: "2026-09-03", end: "2026-12-08"}  # 목요일 시작
  locations:
    - {name: Bahen Centre, travel_minutes: 10}
  events:
    - {title: ECE360 Lecture, days: [MO, WE], start: "2026-09-07T10:00", end: "2026-09-07T11:00", range: Lecture Period, importance: 3}
    - {title: 물리 퀴즈, days: [SA], start: "2026-09-05T17:00", end: "2026-09-05T18:00", range: 2026-2학기, importance: 4}

